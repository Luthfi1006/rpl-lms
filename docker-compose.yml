version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rpl_lms_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rpl_lms
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rpl_lms']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
