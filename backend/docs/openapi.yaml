        '404':
          description: Sesi presensi tidak ditemukan

  /attendance/records/{id}:
    put:
      tags: [Attendance]
      summary: Koreksi status kehadiran oleh dosen pengampu/Admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttendanceRecordRequest'
      responses:
        '200':
          description: Status kehadiran diperbarui dan dicatat pada audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecordResponse'
        '400':
          description: Status atau catatan tidak valid
        '403':
          description: Hanya dosen pengampu atau Admin yang boleh mengoreksi
        '404':
          description: Rekaman kehadiran tidak ditemukan

  /materials/{id}:
    put:
      tags: [Materials]
      summary: Perbarui informasi materi perkuliahan
      description: Dosen pengampu atau Admin dapat memperbarui judul dan/atau deskripsi materi. Berkas lampiran tidak dapat diganti melalui endpoint ini — unggah ulang materi baru bila berkas perlu diganti.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaterialRequest'
      responses:
        '200':
          description: Materi berhasil diperbarui dan dicatat pada audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Data materi tidak valid atau tidak ada data yang diperbarui
        '403':
          description: Hanya dosen pengampu atau Admin yang boleh memperbarui
        '404':
          description: Materi tidak ditemukan
    delete:
      tags: [Materials]
      summary: Hapus materi dan berkas privat terkait
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Materi berhasil dihapus dan dicatat pada audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Hanya dosen pengampu atau Admin yang boleh menghapus
        '404':
          description: Materi tidak ditemukan

  /materials/{id}/download:
    get:
      tags: [Materials]
      summary: Unduh materi secara aman
      description: Akses hanya diberikan kepada mahasiswa terdaftar, dosen pengampu, atau Admin. Materi tidak dipublikasikan tidak tersedia bagi mahasiswa.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: Berkas materi dialirkan dengan Content-Disposition attachment
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Pengguna tidak terdaftar atau bukan dosen pengampu
        '404':
          description: Materi, berkas, atau pertemuan tidak tersedia
